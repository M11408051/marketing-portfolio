<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台湾の学生街グルメガイド — 侯佩岑</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Helvetica Neue',sans-serif;
  background:#1a1714;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;
  padding:20px;
}

.mag-title{
  color:rgba(255,255,255,0.5);
  font-size:12px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin-bottom:16px;
  font-weight:300;
}

/* ── Book container ── */
.book-wrap{
  position:relative;
  display:flex;
  align-items:stretch;
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
  max-width:900px;
  width:100%;
}

/* spine shadow */
.book-wrap::after{
  content:'';
  position:absolute;
  left:50%;
  top:0;bottom:0;
  width:3px;
  background:linear-gradient(to right,rgba(0,0,0,0.4),rgba(0,0,0,0.1),rgba(0,0,0,0.4));
  transform:translateX(-50%);
  pointer-events:none;
  z-index:10;
}

.page-left,.page-right{
  flex:1;
  aspect-ratio:3/4.24;
  overflow:hidden;
  position:relative;
  background:#f5f0ea;
}

.page-left img,.page-right img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transition:opacity 0.25s ease;
}

/* single page mode (cover/back) */
.book-wrap.single-left .page-right{display:none}
.book-wrap.single-right .page-left{display:none}
.book-wrap.single-left,.book-wrap.single-right{justify-content:center;max-width:450px}

/* ── Controls ── */
.controls{
  display:flex;
  align-items:center;
  gap:20px;
  margin-top:20px;
}

.btn{
  background:rgba(255,255,255,0.1);
  border:0.5px solid rgba(255,255,255,0.2);
  color:rgba(255,255,255,0.8);
  padding:10px 24px;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
  transition:background 0.2s,transform 0.15s;
  font-family:inherit;
  letter-spacing:0.04em;
}
.btn:hover{background:rgba(255,255,255,0.18);transform:translateY(-1px)}
.btn:disabled{opacity:0.3;cursor:default;transform:none}

.page-info{
  color:rgba(255,255,255,0.45);
  font-size:12px;
  letter-spacing:0.06em;
  min-width:80px;
  text-align:center;
}

/* ── Page thumbnails ── */
.thumb-strip{
  display:flex;
  gap:6px;
  margin-top:16px;
  max-width:900px;
  width:100%;
  overflow-x:auto;
  padding-bottom:6px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.2) transparent;
}
.thumb{
  flex-shrink:0;
  width:44px;height:62px;
  border-radius:3px;
  overflow:hidden;
  cursor:pointer;
  opacity:0.4;
  transition:opacity 0.2s,transform 0.15s;
  border:1.5px solid transparent;
}
.thumb:hover{opacity:0.75;transform:translateY(-2px)}
.thumb.active{opacity:1;border-color:rgba(255,255,255,0.5)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* ── Keyboard hint ── */
.hint{
  color:rgba(255,255,255,0.2);
  font-size:11px;
  margin-top:10px;
  letter-spacing:0.06em;
}

/* RWD */
@media(max-width:700px){
  .book-wrap{max-width:100%}
  .book-wrap.single-left,.book-wrap.single-right{max-width:100%}
  .thumb{width:36px;height:51px}
}
</style>
</head>
<body>

<div class="mag-title">台湾の学生街グルメガイド — 侯佩岑 · 2023</div>

<div class="book-wrap" id="book">
  <div class="page-left" id="pageL">
    <img id="imgL" src="" alt="左頁">
  </div>
  <div class="page-right" id="pageR">
    <img id="imgR" src="" alt="右頁">
  </div>
</div>

<div class="controls">
  <button class="btn" id="btnPrev" onclick="turn(-1)">← 上一頁</button>
  <div class="page-info" id="pageInfo"></div>
  <button class="btn" id="btnNext" onclick="turn(1)">下一頁 →</button>
</div>

<div class="thumb-strip" id="thumbStrip"></div>

<div class="hint">← → 鍵盤方向鍵也可以翻頁</div>

<script>
const TOTAL = 66;
// Pages array: 0 = cover (p01), then pairs (2+3, 4+5...), last = back cover
// spread index: 0 = cover alone, 1 = p2+p3, 2 = p4+p5 ... 33 = p66 alone
const SPREADS = [];
SPREADS.push({type:'single-left', pages:[1]});     // cover
for(let i=2; i<=65; i+=2){
  SPREADS.push({type:'double', pages:[i, i+1]});
}
SPREADS.push({type:'single-right', pages:[66]});  // back cover

let current = 0;

function pad(n){return n.toString().padStart(2,'0')}
function imgPath(n){return `p${pad(n)}.jpg`}

function render(){
  const spread = SPREADS[current];
  const book = document.getElementById('book');
  const imgL = document.getElementById('imgL');
  const imgR = document.getElementById('imgR');
  const pageL = document.getElementById('pageL');
  const pageR = document.getElementById('pageR');

  book.className = 'book-wrap';

  if(spread.type === 'single-left'){
    book.classList.add('single-left');
    imgL.src = imgPath(spread.pages[0]);
    imgL.alt = `第 ${spread.pages[0]} 頁`;
    pageR.style.display = 'none';
    pageL.style.display = 'block';
  } else if(spread.type === 'single-right'){
    book.classList.add('single-right');
    imgR.src = imgPath(spread.pages[0]);
    imgR.alt = `第 ${spread.pages[0]} 頁`;
    pageL.style.display = 'none';
    pageR.style.display = 'block';
  } else {
    pageL.style.display = 'block';
    pageR.style.display = 'block';
    imgL.src = imgPath(spread.pages[0]);
    imgR.src = imgPath(spread.pages[1]);
    imgL.alt = `第 ${spread.pages[0]} 頁`;
    imgR.alt = `第 ${spread.pages[1]} 頁`;
  }

  // page info
  const pages = spread.pages;
  const label = pages.length === 1
    ? `第 ${pages[0]} 頁 / ${TOTAL}`
    : `第 ${pages[0]}–${pages[1]} 頁 / ${TOTAL}`;
  document.getElementById('pageInfo').textContent = label;

  // buttons
  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').disabled = current === SPREADS.length - 1;

  // thumbnails
  document.querySelectorAll('.thumb').forEach((t,i)=>{
    t.classList.toggle('active', i === current);
    if(i === current){
      t.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    }
  });
}

function turn(dir){
  const next = current + dir;
  if(next >= 0 && next < SPREADS.length){
    current = next;
    render();
  }
}

// build thumbnails
const strip = document.getElementById('thumbStrip');
SPREADS.forEach((spread, i) => {
  const div = document.createElement('div');
  div.className = 'thumb';
  div.title = `第 ${spread.pages.join('–')} 頁`;
  const img = document.createElement('img');
  img.src = imgPath(spread.pages[0]);
  img.loading = 'lazy';
  div.appendChild(img);
  div.onclick = () => { current = i; render(); };
  strip.appendChild(div);
});

// keyboard
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown') turn(1);
  if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') turn(-1);
});

render();
</script>
</body>
</html>
